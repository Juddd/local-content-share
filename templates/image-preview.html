<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - 内容中转</title>
    <link rel="icon" type="image/png" href="/icon-192.png?v=app-logo-2">
    <style>
        :root { color-scheme: light dark; }
        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eff1f5;
        }
        img {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #1e1e2e; }
        }
    </style>
</head>
<body>
    <img src="{{.ImageURL}}" alt="{{.Title}}">
</body>
</html>
