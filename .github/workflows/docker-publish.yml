name: Publish Personal Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v40.7

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/juddd/local-content-share
  RELEASE_TAG: v40.7

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit tests
        run: go test ./...

  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create personal release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Local Content Share 个人增强版 $RELEASE_TAG" \
              --notes-file .github/release-notes-v40.7.md
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Local Content Share 个人增强版 $RELEASE_TAG" \
              --notes-file .github/release-notes-v40.7.md
          fi
      - name: Attach signed Android APK when NAS is reachable
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          apk=content-transfer-v1.0.65.apk
          if curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 \
              -o "$apk" \
              http://nas.yode.ink:8084/download/files/content-transfer-v1.0.65.apk \
              && echo "9dddded38e3ecc55f16dc5c3913330b35d690e182510c29ec919ad85ea10d4ef  $apk" | sha256sum --check; then
            gh release upload "$RELEASE_TAG" "$apk" --clobber
          else
            echo "NAS APK is unavailable; keeping the existing release asset and continuing image publication" >&2
          fi
      - name: Upload sanitized README screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 \
            -o desktop-raw.png \
            http://nas.yode.ink:8084/view/a84428cd-ada0-4ec6-9eb4-24b8cbf072b0
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 \
            -o android-files-raw.jpg \
            http://nas.yode.ink:8084/view/6ad8d279-1855-445a-af1a-79fde590c15e
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 \
            -o android-devices-raw.jpg \
            http://nas.yode.ink:8084/view/86237f95-b60e-4bdc-ad26-c4915e1be30a
          echo "94396d43b2f3e536a8ee27c3d3d1ab3bcb10e25ecbfd5c200b35e149addc5db1  desktop-raw.png" | sha256sum --check
          echo "360bc9403fae864b55c3d81429272b00d2fef9d9bc165e379091a643a3db6e14  android-files-raw.jpg" | sha256sum --check
          echo "e943dd406056c478f1b898054a23c00493512790b3d9da098854f28f1881e06f  android-devices-raw.jpg" | sha256sum --check
          if command -v magick >/dev/null 2>&1; then
            image_tool=magick
          elif command -v convert >/dev/null 2>&1; then
            image_tool=convert
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            image_tool=convert
          fi
          "$image_tool" desktop-raw.png \
            \( +clone -crop 3759x690+0+210 +repage -blur 0x22 \) \
            -geometry +0+210 -composite -resize 1800x -strip -quality 88 readme-desktop.jpg
          "$image_tool" android-files-raw.jpg -resize 600x -strip -quality 84 readme-android-files.jpg
          "$image_tool" android-devices-raw.jpg -resize 600x -strip -quality 84 readme-android-devices.jpg
          echo "2fc9ba11b94a56d87fb94f0a49a565f30c287cb5144326713addcf3af4cfa792  readme-desktop.jpg" | sha256sum --check
          echo "78191e214e524b8a217e1df626f088b2eb502e6ce48bcc189bdffce06e5277d0  readme-android-files.jpg" | sha256sum --check
          echo "c75d46db909df362cf796da6f0eefc9c6d1ce480f4f2e7a66e6f2aa732e00191  readme-android-devices.jpg" | sha256sum --check
          gh release upload "$RELEASE_TAG" \
            readme-desktop.jpg readme-android-files.jpg readme-android-devices.jpg --clobber

  publish-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
