plugins { id 'com.android.application' }

android {
    namespace 'ink.yode.contenttransfer'
    compileSdk 36

    defaultConfig {
        applicationId 'ink.yode.contenttransfer'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.0.2'
    }

    signingConfigs {
        release {
            def props = new Properties()
            def file = rootProject.file('signing.properties')
            if (file.exists()) { file.withInputStream { props.load(it) } }
            def signingStore = System.getenv('CONTENT_TRANSFER_KEYSTORE') ?: props['storeFile']
            storeFile signingStore ? rootProject.file(signingStore) : null
            storePassword System.getenv('CONTENT_TRANSFER_STORE_PASSWORD') ?: props['storePassword']
            keyAlias System.getenv('CONTENT_TRANSFER_KEY_ALIAS') ?: props['keyAlias']
            keyPassword System.getenv('CONTENT_TRANSFER_KEY_PASSWORD') ?: props['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
